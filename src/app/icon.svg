<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="3" height="6" fill="#f5c518" />
      <rect x="3" width="3" height="6" fill="#18181b" />
    </pattern>
  </defs>

  <!-- Dark theater background -->
  <rect width="32" height="32" rx="7" fill="#0d0d10" />

  <!-- Lower slate body -->
  <rect x="4" y="13" width="24" height="15" rx="2.5" fill="#18181b" stroke="#f5c518" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Slate chalk sections (SCENE | TAKE | ROLL) -->
  <path d="M4 19H28 M13 19V28 M20 19V28" stroke="#f5c518" stroke-width="0.9" stroke-opacity="0.45" />

  <!-- Gold Star in slate box -->
  <path d="M8.5 22.8L9.2 24.2L10.7 24.4L9.6 25.4L9.9 26.9L8.5 26.1L7.1 26.9L7.4 25.4L6.3 24.4L7.8 24.2Z" fill="#f5c518" />

  <!-- Lower fixed clapper stick -->
  <rect x="4" y="9.5" width="24" height="4" rx="1" fill="url(#stripes)" stroke="#f5c518" stroke-width="1" />

  <!-- Upper open clapper arm hinged on the left -->
  <g transform="rotate(-15 4 10)">
    <rect x="4" y="5.5" width="24" height="4" rx="1" fill="url(#stripes)" stroke="#f5c518" stroke-width="1" />
  </g>

  <!-- Hinge pin -->
  <circle cx="4.5" cy="10" r="1.5" fill="#f5c518" stroke="#0d0d10" stroke-width="0.8" />
</svg>
